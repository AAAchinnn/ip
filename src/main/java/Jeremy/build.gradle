plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

javafx {
    version = '17.0.13'
    modules = [ 'javafx.controls' ]
}

// The current project keeps its Java files directly in the project root.
// Tell Gradle to compile that layout instead of looking only in src/main/java.
sourceSets {
    main {
        java {
            srcDirs = ['.']
            // Only compile Java files directly in this project folder.
            include '*.java'
            exclude '*Test.java'
        }
    }
    test {
        java {
            // Tests are not compatible with the current flat root layout.
            srcDirs = []
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'jeremy.Jeremy'
}


test {
    enabled = false
    useJUnitPlatform()
}

// Enable Java assert statements when the GUI is run.
tasks.named('run') {
    enableAssertions = true
}

// There are no test source directories in the current flat project layout.
// Disable the compiler task itself so Gradle 9 does not validate it against
// the generated application start-script files.
tasks.named('compileTestJava') {
    enabled = false
}
